name: Magic Sticker CI/CD

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_notes:
        description: '發版說明（選填，留空自動產生）'
        required: false
        default: ''

jobs:
  # ─── Dart Analyze（push main 輕量檢查，幾分鐘內完成）──────────
  dart-analyze:
    name: Dart Analyze
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # PR merge 觸發的完整 build 不需要再跑 analyze
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.1'
          channel: 'stable'
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Dart analyze
        run: dart analyze --fatal-infos

  # ─── Android Build（tag v* 或手動觸發才跑）──────────────────
  android-build:
    name: Android Build
    runs-on: ubuntu-latest
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.1'
          channel: 'stable'
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons -f flutter_launcher_icons_android.yaml

      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON_ANDROID }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "❌ ERROR: GOOGLE_SERVICES_JSON_ANDROID secret is not set"
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          python3 -c "import json,sys; d=json.load(open('android/app/google-services.json')); assert 'project_info' in d, 'missing project_info'; p=d['project_info'].get('project_id',''); assert 'placeholder' not in p, 'placeholder project: '+p; print('OK project_id='+p)"

      - name: Setup Android Release Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "⚠️ WARNING: ANDROID_KEYSTORE_BASE64 not set, using debug signing"
          else
            echo "$KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
            cat > android/key.properties <<EOF
          storePassword=${STORE_PASSWORD}
          keyPassword=${KEY_PASSWORD}
          keyAlias=${KEY_ALIAS}
          storeFile=../upload-keystore.jks
          EOF
            echo "✅ Release keystore configured"
          fi

      - name: Build APK (release)
        run: |
          flutter build apk --release \
            --dart-define=STICKER_BG_TRANSPARENT=${{ vars.STICKER_BG_TRANSPARENT || 'true' }}

      - name: Build AAB (release)
        run: |
          flutter build appbundle --release \
            --dart-define=STICKER_BG_TRANSPARENT=${{ vars.STICKER_BG_TRANSPARENT || 'true' }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: build/app/outputs/bundle/release/app-release.aab

      - name: Upload mapping.txt
        uses: actions/upload-artifact@v4
        with:
          name: android-mapping
          path: build/app/outputs/mapping/release/mapping.txt

  # ─── GitHub Release ───────────────────────────────────────────
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: android-build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Read version from pubspec.yaml
        id: ver
        run: |
          RAW=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          echo "raw=$RAW" >> "$GITHUB_OUTPUT"
          echo "tag=v$RAW"  >> "$GITHUB_OUTPUT"

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: dist/

      - name: Rename APK with version
        run: mv dist/app-release.apk "dist/MagicSticker-${{ steps.ver.outputs.raw }}.apk"

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: "Magic Sticker ${{ steps.ver.outputs.raw }}"
          body: |
            ## 📦 Magic Sticker `${{ steps.ver.outputs.raw }}`

            ${{ github.event.inputs.release_notes != '' && github.event.inputs.release_notes || format('> 自動建置 · commit `{0}`', github.sha) }}

            ### 安裝方式
            1. 下載下方 `MagicSticker-*.apk`
            2. 手機開啟「允許安裝未知來源」
            3. 點擊 APK 安裝
          files: "dist/MagicSticker-${{ steps.ver.outputs.raw }}.apk"
          make_latest: true
          fail_on_unmatched_files: true

  # ─── Cloud Functions Deploy ────────────────────────────────
  deploy-functions:
    name: Deploy Cloud Functions
    runs-on: ubuntu-latest
    needs: android-build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: functions/package.json

      - name: Install Functions dependencies
        run: cd functions && npm install

      - name: Generate functions/.env from GitHub Variables
        run: |
          cat > functions/.env <<EOF
          GEMINI_TEXT_MODEL=${{ vars.GEMINI_TEXT_MODEL || 'gemini-2.0-flash-lite' }}
          GEMINI_IMAGE_MODEL=${{ vars.GEMINI_IMAGE_MODEL || 'gemini-2.5-flash-image' }}
          EOF
          sed -i 's/^[[:space:]]*//' functions/.env
          echo "Generated functions/.env:"
          cat functions/.env

      - name: Build Functions
        run: cd functions && npm run build

      # Firebase defineSecret() 會在部署時要求 secret 已存在於 Secret Manager。
      # 非互動式 CI 無法提示輸入，在 Deploy 前用 gcloud 直接建立/更新 secret version。
      # 所需 GitHub Secrets：
      #   APP_STORE_KEY_ID      — App Store Connect API Key 的 Key ID（10 字元）
      #   APP_STORE_CONNECT_ISSUER_ID — App Store Connect Issuer ID（UUID）
      #   APP_STORE_CONNECT_API_KEY   — .p8 私鑰完整內容（含 BEGIN/END PRIVATE KEY 標頭）
      #   （Firebase Secret Manager 內部名稱為 APP_STORE_KEY_ID / APP_STORE_ISSUER_ID /
      #     APP_STORE_PRIVATE_KEY，由下方 provision_secret 對應寫入）
      - name: Provision Firebase Secrets via gcloud
        env:
          APP_STORE_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}' > /tmp/sa.json
          gcloud auth activate-service-account --key-file=/tmp/sa.json
          gcloud config set project ${{ secrets.FIREBASE_PROJECT_ID }}
          PROJECT=${{ secrets.FIREBASE_PROJECT_ID }}

          provision_secret() {
            local NAME="$1"
            local VALUE="$2"
            # 確保 Secret Manager 中的 secret 存在（Firebase deploy 需要此 secret 存在才不會報錯）
            gcloud secrets describe "$NAME" --project="$PROJECT" > /dev/null 2>&1 || \
              gcloud secrets create "$NAME" --replication-policy="automatic" --project="$PROJECT"
            if [ -z "$VALUE" ]; then
              # GitHub Secret 未設定：若 Secret Manager 中已有 version 則不動，
              # 否則加入 placeholder 讓 Firebase deploy 不會因「no value」中止。
              NVER=$(gcloud secrets versions list "$NAME" --project="$PROJECT" \
                       --format="value(name)" 2>/dev/null | wc -l)
              if [ "$NVER" -eq 0 ]; then
                echo "⚠️  $NAME not configured — adding placeholder (set real value in GitHub Secrets)"
                printf '%s' "NOT_CONFIGURED" | \
                  gcloud secrets versions add "$NAME" --data-file=- --project="$PROJECT"
              else
                echo "ℹ️  $NAME GitHub secret not set — existing Secret Manager version retained"
              fi
            else
              printf '%s' "$VALUE" | gcloud secrets versions add "$NAME" --data-file=- --project="$PROJECT"
              echo "✅ $NAME provisioned"
            fi
          }

          provision_secret GEMINI_API_KEY       "$GEMINI_API_KEY"
          provision_secret APP_STORE_KEY_ID     "$APP_STORE_KEY_ID"
          provision_secret APP_STORE_ISSUER_ID  "$APP_STORE_ISSUER_ID"
          provision_secret APP_STORE_PRIVATE_KEY "$APP_STORE_PRIVATE_KEY"

          rm -f /tmp/sa.json

      - name: Deploy Functions
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only functions --force --project ${{ secrets.FIREBASE_PROJECT_ID }}
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Grant firebaserules.admin to SA (idempotent)
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}' > /tmp/sa.json
          gcloud auth activate-service-account --key-file=/tmp/sa.json
          gcloud config set project ${{ secrets.FIREBASE_PROJECT_ID }}
          SA_EMAIL=$(python3 -c "import json; print(json.load(open('/tmp/sa.json'))['client_email'])")
          gcloud projects add-iam-policy-binding ${{ secrets.FIREBASE_PROJECT_ID }} \
            --member="serviceAccount:${SA_EMAIL}" \
            --role="roles/firebaserules.admin" \
            --condition=None \
            2>&1 && echo "✅ roles/firebaserules.admin granted" || echo "⚠️  IAM grant failed (may already exist or SA lacks resourcemanager.projectIamAdmin)"

      - name: Deploy Firestore Rules
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only firestore:rules --project ${{ secrets.FIREBASE_PROJECT_ID }}
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Set Cloud Run IAM (allUsers invoker)
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}' > /tmp/sa.json
          gcloud auth activate-service-account --key-file=/tmp/sa.json
          gcloud config set project ${{ secrets.FIREBASE_PROJECT_ID }}
          for SVC in generatestickerspecs generatestickerimage verifypropurchase fulfillcreditpurchase getconfig; do
            gcloud run services add-iam-policy-binding "$SVC" \
              --region=asia-east1 --member=allUsers --role=roles/run.invoker \
              2>&1 || echo "⚠️  IAM binding failed for $SVC (may not exist yet, skipping)"
          done
          rm /tmp/sa.json

      - name: Smoke test — verify Cloud Functions are live
        run: |
          REGION="asia-east1"
          PROJECT="${{ secrets.FIREBASE_PROJECT_ID }}"
          URL="https://${REGION}-${PROJECT}.cloudfunctions.net/getConfig"

          echo "🔍 Calling getConfig: $URL"

          MAX_RETRY=5
          WAIT=15
          RESP=""
          HTTP_STATUS=""

          for i in $(seq 1 $MAX_RETRY); do
            RAW=$(curl -s -o /tmp/cf_resp.json -w "%{http_code}" \
              -X POST "$URL" \
              -H "Content-Type: application/json" \
              -d '{"data":{}}' \
              --max-time 30) || RAW="000"
            HTTP_STATUS="$RAW"
            RESP=$(cat /tmp/cf_resp.json 2>/dev/null || echo "")

            if [ "$HTTP_STATUS" = "200" ]; then
              echo "✅ HTTP 200 on attempt $i"
              break
            fi

            echo "⏳ Attempt $i/$MAX_RETRY — HTTP $HTTP_STATUS, body: $RESP"
            if [ "$i" -lt "$MAX_RETRY" ]; then
              echo "   Waiting ${WAIT}s for IAM propagation..."
              sleep $WAIT
              WAIT=$((WAIT + 10))
            else
              echo "❌ getConfig unreachable after $MAX_RETRY attempts (last HTTP $HTTP_STATUS)"
              exit 1
            fi
          done

          echo "📦 Response: $RESP"

          TEXT_MODEL=$(echo "$RESP" | python3 -c "import sys,json; print(json.load(sys.stdin)['result']['textModel'])" 2>/dev/null)
          IMAGE_MODEL=$(echo "$RESP" | python3 -c "import sys,json; print(json.load(sys.stdin)['result']['imageModel'])" 2>/dev/null)

          if [ -z "$TEXT_MODEL" ] || [ -z "$IMAGE_MODEL" ]; then
            echo "❌ getConfig returned unexpected format"
            echo "$RESP"
            exit 1
          fi

          echo "✅ Cloud Functions alive"
          echo "   Text model:  $TEXT_MODEL"
          echo "   Image model: $IMAGE_MODEL"

  # ─── Firebase App Distribution ────────────────────────────
  firebase-distribute:
    name: Firebase App Distribution
    runs-on: ubuntu-latest
    needs: android-build
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk

      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID_ANDROID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          groups: testers
          file: app-release.apk
          releaseNotes: |
            ${{ github.event.inputs.release_notes != '' && github.event.inputs.release_notes || github.ref_name }}

  # ─── Firebase Hosting Deploy（隱私政策 + App Links assetlinks.json）────────
  deploy-hosting:
    name: Deploy Hosting (Privacy Policy + App Links)
    runs-on: ubuntu-latest
    needs: android-build
    steps:
      - uses: actions/checkout@v4

      - name: Inject SHA-256 Fingerprint into assetlinks.json
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "⚠️  ANDROID_KEYSTORE_BASE64 not set — assetlinks.json 將保留 placeholder，App Links 無法通過 Android 驗證"
            exit 0
          fi

          # 解碼 keystore
          echo "$KEYSTORE_BASE64" | base64 --decode > /tmp/release.jks

          # 從 keystore 提取 SHA-256 fingerprint（keytool 為 JRE 標準工具，Ubuntu runner 內建）
          SHA256=$(keytool -list -v \
            -keystore /tmp/release.jks \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            2>/dev/null \
            | grep "SHA256:" \
            | awk '{print $2}')

          rm /tmp/release.jks

          if [ -z "$SHA256" ]; then
            echo "❌ 無法從 keystore 提取 SHA-256，請確認 STORE_PASSWORD / KEY_ALIAS 正確"
            exit 1
          fi

          echo "✅ SHA-256: $SHA256"

          # 覆寫 assetlinks.json（repo 中的 placeholder → 真實 fingerprint）
          # 此檔案僅在 CI deploy 時有真實值，repo 本身保留 placeholder 避免意外洩漏
          python3 - <<PYEOF
          import json

          content = [
            {
              "relation": ["delegate_permission/common.handle_all_urls"],
              "target": {
                "namespace": "android_app",
                "package_name": "com.magicsticker.magic_sticker",
                "sha256_cert_fingerprints": ["$SHA256"]
              }
            }
          ]

          with open("public/.well-known/assetlinks.json", "w") as f:
            json.dump(content, f, indent=2)
            f.write("\n")

          print("✅ assetlinks.json 已注入真實 fingerprint")
          PYEOF

      - name: Deploy to Firebase Hosting
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only hosting --project ${{ secrets.FIREBASE_PROJECT_ID }}
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

  # ─── Google Play Store Deploy ──────────────────────────────
  play-store-deploy:
    name: Google Play Store (internal track)
    runs-on: ubuntu-latest
    needs: android-build
    steps:
      - name: Download AAB artifact
        uses: actions/download-artifact@v4
        with:
          name: android-aab
          path: dist/

      - name: Download mapping.txt
        uses: actions/download-artifact@v4
        with:
          name: android-mapping
          path: mapping/
        continue-on-error: true

      - name: Upload to Google Play (internal track)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.magicsticker.magic_sticker
          releaseFiles: dist/app-release.aab
          track: internal
          status: draft
          mappingFile: mapping/mapping.txt

  # ─── iOS Build & TestFlight ───────────────────────────────────
  ios-build:
    name: iOS Build & TestFlight
    runs-on: macos-15
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      # Apple 要求 2026/04/28 起所有 iOS/iPadOS App 必須以 iOS 26 SDK（Xcode 26）建置
      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.1'
          channel: 'stable'
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Initialize iOS platform
        run: |
          if [ ! -d "ios" ]; then
            flutter create --platforms=ios --org com.magicsticker .
            echo "✅ iOS platform initialized"
          else
            echo "✅ iOS platform already exists"
          fi

      - name: Configure iOS project
        run: |
          PBXPROJ="ios/Runner.xcodeproj/project.pbxproj"
          # Bundle identifier
          sed -i '' \
            's/PRODUCT_BUNDLE_IDENTIFIER = .*/PRODUCT_BUNDLE_IDENTIFIER = com.magicsticker.magic-sticker;/g' \
            "$PBXPROJ"
          # iOS deployment target
          sed -i '' \
            's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*/IPHONEOS_DEPLOYMENT_TARGET = 15.0/g' \
            "$PBXPROJ"
          # Podfile platform
          sed -i '' "s/# platform :ios, '[0-9.]*'/platform :ios, '15.0'/" ios/Podfile 2>/dev/null || true
          sed -i '' "s/platform :ios, '[0-9.]*'/platform :ios, '15.0'/" ios/Podfile 2>/dev/null || true
          # Display name
          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleDisplayName 'Magic Sticker'" \
            ios/Runner/Info.plist 2>/dev/null || \
          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleDisplayName string 'Magic Sticker'" \
            ios/Runner/Info.plist
          # 加密合規聲明：App 不使用非豁免加密，跳過 TestFlight 合規問卷
          /usr/libexec/PlistBuddy \
            -c "Set :ITSAppUsesNonExemptEncryption false" \
            ios/Runner/Info.plist 2>/dev/null || \
          /usr/libexec/PlistBuddy \
            -c "Add :ITSAppUsesNonExemptEncryption bool false" \
            ios/Runner/Info.plist
          # 使用 GitHub run number 作為 build number，確保 TestFlight 每次上傳唯一
          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleVersion ${{ github.run_number }}" \
            ios/Runner/Info.plist 2>/dev/null || \
          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleVersion string ${{ github.run_number }}" \
            ios/Runner/Info.plist
          echo "✅ Bundle: com.magicsticker.magic-sticker, iOS 15.0+, build=${{ github.run_number }}"
          # AdMob App ID — 有設定 secret 則用正式 ID，否則沿用 Info.plist 內的測試 ID
          if [ -n "${{ secrets.IOS_ADMOB_APP_ID }}" ]; then
            /usr/libexec/PlistBuddy \
              -c "Set :GADApplicationIdentifier ${{ secrets.IOS_ADMOB_APP_ID }}" \
              ios/Runner/Info.plist 2>/dev/null || \
            /usr/libexec/PlistBuddy \
              -c "Add :GADApplicationIdentifier string ${{ secrets.IOS_ADMOB_APP_ID }}" \
              ios/Runner/Info.plist
            echo "✅ GADApplicationIdentifier injected from secret"
          else
            echo "⚠️  IOS_ADMOB_APP_ID secret 未設定，使用 Info.plist 預設 Test App ID"
          fi

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Write GoogleService-Info.plist
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          if [ -z "$GOOGLE_SERVICE_INFO_PLIST" ]; then
            echo "❌ GOOGLE_SERVICE_INFO_PLIST secret is missing"
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICE_INFO_PLIST" > ios/Runner/GoogleService-Info.plist
          echo "✅ GoogleService-Info.plist written"

      - name: Import Distribution Certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          echo "$CERTIFICATE_BASE64" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/certificate.p12" \
            -P "$CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          echo "✅ Distribution certificate imported"

      - name: Install Provisioning Profile
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          PP_PATH=$RUNNER_TEMP/profile.mobileprovision
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PP_PATH"
          security cms -D -i "$PP_PATH" > /tmp/profile_decoded.plist
          PP_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" /tmp/profile_decoded.plist)
          PP_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" /tmp/profile_decoded.plist)
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"${PP_UUID}".mobileprovision
          echo "PP_NAME=$PP_NAME" >> $GITHUB_ENV
          echo "✅ Provisioning profile installed: $PP_NAME ($PP_UUID)"

      - name: Configure Xcode Manual Signing
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          PBXPROJ="ios/Runner.xcodeproj/project.pbxproj"
          # Switch from Automatic to Manual signing
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' "$PBXPROJ"
          # Inject team ID (handles both empty string and existing value)
          sed -i '' "s/DEVELOPMENT_TEAM = \"\";/DEVELOPMENT_TEAM = $APPLE_TEAM_ID;/g" "$PBXPROJ"
          sed -i '' "s/DEVELOPMENT_TEAM = [A-Z0-9]*;/DEVELOPMENT_TEAM = $APPLE_TEAM_ID;/g" "$PBXPROJ"
          # Set provisioning profile specifier (replace existing or insert after CODE_SIGN_STYLE)
          if grep -q "PROVISIONING_PROFILE_SPECIFIER" "$PBXPROJ"; then
            sed -i '' "s/PROVISIONING_PROFILE_SPECIFIER = .*;/PROVISIONING_PROFILE_SPECIFIER = \"$PP_NAME\";/g" "$PBXPROJ"
          else
            sed -i '' "s/CODE_SIGN_STYLE = Manual;/CODE_SIGN_STYLE = Manual;\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = \"$PP_NAME\";/g" "$PBXPROJ"
          fi
          # Set code sign identity
          sed -i '' 's/CODE_SIGN_IDENTITY = "iPhone Developer";/CODE_SIGN_IDENTITY = "iPhone Distribution";/g' "$PBXPROJ"
          sed -i '' 's/CODE_SIGN_IDENTITY = "";/CODE_SIGN_IDENTITY = "iPhone Distribution";/g' "$PBXPROJ"
          echo "✅ Xcode project: Manual signing, team=$APPLE_TEAM_ID, profile=$PP_NAME"

      - name: Create ExportOptions.plist
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          python3 - <<'PYEOF'
          import plistlib, os
          plist = {
            'method': 'app-store',
            'teamID': os.environ['APPLE_TEAM_ID'],
            'signingStyle': 'manual',
            'uploadBitcode': False,
            'compileBitcode': False,
            'uploadSymbols': True,
            'provisioningProfiles': {
              'com.magicsticker.magic-sticker': os.environ['PP_NAME']
            }
          }
          with open('ios/ExportOptions.plist', 'wb') as f:
            plistlib.dump(plist, f, fmt=plistlib.FMT_XML)
          print('✅ ExportOptions.plist created (team:', os.environ['APPLE_TEAM_ID'], ')')
          PYEOF

      - name: Build IPA archive (no codesign)
        run: |
          flutter build ipa --release \
            --no-codesign \
            --dart-define=STICKER_BG_TRANSPARENT=${{ vars.STICKER_BG_TRANSPARENT || 'true' }}

      - name: Export IPA with signing
        run: |
          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist ios/ExportOptions.plist \
            -allowProvisioningUpdates
          echo "✅ IPA exported to build/ios/ipa/"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/ios/ipa/*.ipa

      - name: Resolve IPA path
        id: ipa
        run: |
          IPA_PATH=$(ls build/ios/ipa/*.ipa | head -1)
          echo "path=$IPA_PATH" >> "$GITHUB_OUTPUT"
          echo "✅ IPA path: $IPA_PATH"

      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v3
        with:
          app-path: ${{ steps.ipa.outputs.path }}
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
