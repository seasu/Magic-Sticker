name: 🎨 Generate Style Thumbnails (12 張)

# 手動觸發，專門產生風格選擇畫面的 12 張縮圖
# 使用 seasu-source.jpg 作為來源，greeting 情緒，加強構圖一致性

on:
  workflow_dispatch:
    inputs:
      styles:
        description: '要重新產生的風格縮圖（選「全部」= 產生所有 12 種）'
        required: false
        type: choice
        default: '全部'
        options:
          - 全部
          - chibi
          - popArt
          - pixel
          - sketch
          - watercolor
          - webtoon
          - celshade
          - pixar3d
          - plush
          - yuruDoodle
          - showaManga
          - claymation
      commit_message:
        description: 'Commit 說明（留空使用預設）'
        required: false
        default: ''

jobs:
  generate:
    name: Generate 12 Style Thumbnails
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install google-genai pillow numpy

      - name: Verify source image
        run: |
          if [ ! -f assets/images/seasu-source.jpg ]; then
            echo "❌ assets/images/seasu-source.jpg not found"
            exit 1
          fi
          echo "✅ Source image: $(du -h assets/images/seasu-source.jpg | cut -f1)"

      - name: Generate thumbnails
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_IMAGE_MODEL: ${{ vars.GEMINI_IMAGE_MODEL || 'gemini-2.5-flash-image' }}
          # 「全部」→ 空字串（腳本視空字串為產生所有風格）
          PREVIEW_STYLES: ${{ github.event.inputs.styles == '全部' && '' || github.event.inputs.styles }}
        run: python3 scripts/generate_style_thumbnails.py

      - name: Show generated files
        run: |
          echo "📁 Generated thumbnails:"
          ls -lh assets/images/preview_*_greeting.png 2>/dev/null || echo "No greeting thumbnails found"

      - name: Create PR with generated thumbnails
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/images/preview_*_greeting.png
          if git diff --cached --quiet; then
            echo "⚠️ No changes to commit"
            exit 0
          fi

          # 遞增版號（patch +1, build +1）以通過 Version Guard
          CURRENT=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          MAJOR_MINOR=$(echo "$CURRENT" | sed 's/\([0-9]*\.[0-9]*\.\)\([0-9]*\)+\([0-9]*\)/\1/')
          PATCH=$(echo "$CURRENT" | sed 's/[0-9]*\.[0-9]*\.\([0-9]*\)+.*/\1/')
          BUILD=$(echo "$CURRENT" | sed 's/.*+//')
          NEW_PATCH=$((PATCH + 1))
          NEW_BUILD=$((BUILD + 1))
          NEW_VER="${MAJOR_MINOR}${NEW_PATCH}+${NEW_BUILD}"
          sed -i "s/^version: .*/version: ${NEW_VER}/" pubspec.yaml
          sed -i "s/| 目前版本 | v[^ ]* |/| 目前版本 | v${NEW_VER} |/" PRD.md
          git add pubspec.yaml PRD.md
          echo "📦 Version bumped: $CURRENT → $NEW_VER"

          BRANCH="auto/style-thumbnails-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH"
          MSG="${{ github.event.inputs.commit_message }}"
          if [ -z "$MSG" ]; then
            MSG="feat(assets): 更新 12 張風格縮圖（seasu-source × greeting）(v${NEW_VER})"
          fi
          git commit -m "$MSG"
          git push origin "$BRANCH"
          PR_BODY="由 **Generate Style Thumbnails** workflow 自動產生。\n\n12 種風格 × greeting 情緒縮圖，使用 seasu-source.jpg 作為來源。\nPrompt 與 App 實際產圖完全一致（中文 Chroma Key 模式）。"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "feat(assets): 更新 12 張風格縮圖" \
            --body "$(printf '%b' "$PR_BODY")"
          echo "✅ PR created from branch $BRANCH"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
