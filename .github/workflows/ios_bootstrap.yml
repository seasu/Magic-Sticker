name: iOS Bootstrap (一次性生成 ios/ 目錄)

# 手動觸發：在 GitHub Actions 頁面點 "Run workflow"
# 執行後會把生成的 ios/ 目錄 commit 回目前分支
# 完成後可刪除此 workflow 檔案（或保留以備重建）

on:
  workflow_dispatch:
    inputs:
      branch:
        description: '目標分支（預設為目前分支）'
        required: false
        default: 'claude/setup-ios-build-rFR2Z'

jobs:
  generate-ios:
    name: Generate ios/ Directory
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.1'
          channel: 'stable'
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Create iOS platform
        run: |
          if [ -d "ios" ]; then
            echo "⚠️  ios/ 已存在，跳過"
            exit 0
          fi
          flutter create --platforms=ios --org com.magicsticker .
          echo "✅ iOS platform generated"

      - name: Configure iOS project
        run: |
          PBXPROJ="ios/Runner.xcodeproj/project.pbxproj"

          # Bundle identifier
          sed -i '' \
            's/PRODUCT_BUNDLE_IDENTIFIER = .*/PRODUCT_BUNDLE_IDENTIFIER = com.magicsticker.magic-sticker;/g' \
            "$PBXPROJ"

          # iOS deployment target
          sed -i '' \
            's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*/IPHONEOS_DEPLOYMENT_TARGET = 15.0/g' \
            "$PBXPROJ"

          # Podfile platform
          sed -i '' "s/# platform :ios, '[0-9.]*'/platform :ios, '15.0'/" ios/Podfile 2>/dev/null || true
          sed -i '' "s/platform :ios, '[0-9.]*'/platform :ios, '15.0'/" ios/Podfile 2>/dev/null || true

          # Display name
          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleDisplayName 'Magic Sticker'" \
            ios/Runner/Info.plist 2>/dev/null || \
          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleDisplayName string 'Magic Sticker'" \
            ios/Runner/Info.plist

          # 加密合規聲明（跳過 TestFlight 合規問卷）
          /usr/libexec/PlistBuddy \
            -c "Set :ITSAppUsesNonExemptEncryption false" \
            ios/Runner/Info.plist 2>/dev/null || \
          /usr/libexec/PlistBuddy \
            -c "Add :ITSAppUsesNonExemptEncryption bool false" \
            ios/Runner/Info.plist

          # NSPhotoLibraryAddUsageDescription（gal 套件儲存相簿所需）
          /usr/libexec/PlistBuddy \
            -c "Set :NSPhotoLibraryAddUsageDescription '儲存貼圖到相簿'" \
            ios/Runner/Info.plist 2>/dev/null || \
          /usr/libexec/PlistBuddy \
            -c "Add :NSPhotoLibraryAddUsageDescription string '儲存貼圖到相簿'" \
            ios/Runner/Info.plist

          # NSPhotoLibraryUsageDescription（image_picker 讀取相簿所需）
          /usr/libexec/PlistBuddy \
            -c "Set :NSPhotoLibraryUsageDescription '選擇要製作貼圖的照片'" \
            ios/Runner/Info.plist 2>/dev/null || \
          /usr/libexec/PlistBuddy \
            -c "Add :NSPhotoLibraryUsageDescription string '選擇要製作貼圖的照片'" \
            ios/Runner/Info.plist

          # NSCameraUsageDescription（image_picker 相機所需）
          /usr/libexec/PlistBuddy \
            -c "Set :NSCameraUsageDescription '拍攝要製作貼圖的照片'" \
            ios/Runner/Info.plist 2>/dev/null || \
          /usr/libexec/PlistBuddy \
            -c "Add :NSCameraUsageDescription string '拍攝要製作貼圖的照片'" \
            ios/Runner/Info.plist

          echo "✅ Bundle: com.magicsticker.magic-sticker, iOS 15.0+"

      - name: Generate iOS launcher icons
        run: |
          # flutter_launcher_icons 預設讀 pubspec.yaml（ios: true 已設定）
          dart run flutter_launcher_icons
          echo "✅ Launcher icons generated"

      - name: Show generated files
        run: |
          echo "=== ios/ 目錄結構 ==="
          find ios -not -path '*/\.*' | head -60

      - name: Commit ios/ to branch
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add ios/
          git status

          if git diff --cached --quiet; then
            echo "⚠️  沒有需要 commit 的變更（ios/ 可能已存在且未變動）"
          else
            git commit -m "chore: generate iOS platform (flutter create --platforms=ios)

- Bundle ID: com.magicsticker.magic-sticker
- Deployment target: iOS 15.0+
- Display name: Magic Sticker
- Privacy descriptions: 相簿讀寫 + 相機
- ITSAppUsesNonExemptEncryption: false
- Launcher icons generated

https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

            git push origin HEAD:${{ github.event.inputs.branch || github.ref_name }}
            echo "✅ ios/ committed and pushed"
          fi
