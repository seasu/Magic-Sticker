<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>下載 Magic Sticker — AI 一鍵貼圖生成器</title>
  <meta name="description" content="用 AI 把照片變成 LINE 貼圖，只需幾秒鐘。立即下載 Magic Sticker。" />
  <link rel="stylesheet" href="/css/brand.css" />
  <style>
    .tagline { font-size: 15px; opacity: 0.9; line-height: 1.6; margin-bottom: 32px; }
  </style>
</head>
<body>
  <div class="card">
    <span class="emoji">✨</span>
    <h1>Magic Sticker</h1>
    <p class="tagline">AI 一鍵把照片變成 LINE 貼圖<br>免費下載，立即體驗</p>
    <a class="btn" id="btnPrimary" href="#">立即下載</a>
    <a class="btn btn-secondary" id="btnSecondary" href="#">前往另一平台</a>
    <p class="hint">支援 Android &amp; iOS</p>
  </div>

  <script>
    const pkg         = 'com.magicsticker.magic_sticker';
    const playUrl     = 'https://play.google.com/store/apps/details?id=' + pkg;
    const appStoreUrl = 'https://apps.apple.com/app/id6761015408';

    const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);

    const primary   = document.getElementById('btnPrimary');
    const secondary = document.getElementById('btnSecondary');

    if (isIOS) {
      primary.href        = appStoreUrl;
      primary.textContent = '前往 App Store 下載';
      secondary.href        = playUrl;
      secondary.textContent = '前往 Google Play';
    } else {
      primary.href        = playUrl;
      primary.textContent = '前往 Google Play 下載';
      secondary.href        = appStoreUrl;
      secondary.textContent = '前往 App Store';
    }
  </script>
</body>
</html>
